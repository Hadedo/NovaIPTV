name: Generate Release Key

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore & Base64
        run: |
          keytool -genkey -v -keystore devkan-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias devkan_vip -storepass Devkan34VIP! -keypass Devkan34VIP! -dname "CN=DEVKAN, OU=VIP, O=DEVKAN, L=Baghdad, S=Baghdad, C=IQ"
          base64 -w 0 devkan-release.jks > keystore_base64.txt

      - name: Upload Keystore Files
        uses: actions/upload-artifact@v4
        with:
          name: devkan-keystore
          path: |
            devkan-release.jks
            keystore_base64.txt
