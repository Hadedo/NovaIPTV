Name: Build NovaIPTV Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate and Save Keystore Once
        run: |
          if [ ! -f app/nova_release.jks ]; then
            keytool -genkeypair -v -keystore app/nova_release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias nova_key -storepass NovaIptv2026Pro -keypass NovaIptv2026Pro -dname "CN=NovaIPTV, OU=Dev, O=Hadedo, L=Baghdad, C=IQ"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f app/nova_release.jks
            git commit -m "Save permanent release keystore"
            git push
          fi

      - name: Build Signed Release APK
        run: gradle assembleRelease

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DEVKAN-34-VIP-Signed
          path: app/build/outputs/apk/release/*.apk
